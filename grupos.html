<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathStudy - Grupos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- AQUI ESTÁ A CORREÇÃO: Usando a tag semântica <header> -->
    <header class="dash-top">
      <h1 class="dash-logo">PathStudy</h1>
      <div class="green-line"></div>

      <div class="action-header">
        <div class="action-buttons">
          <button class="btn btn-blue">Criar grupo</button>
          <button class="btn btn-gray">Editar 📝</button>
        </div>

        <div class="dropdown">
          <!-- O ícone que fica visível -->
          <div class="menu-icon">☰</div>

          <!-- A caixinha escondida que vai aparecer -->
          <div class="conteudo-dropdown">
            <a href="index.html">Início</a>
            <a href="dashboard.html">Painel</a>
            <a href="grupos.html">Grupos</a>
            <a href="contato.html">Contato</a>
            <a href="login.html">Sair</a>
          </div>
        </div>
      </div>
    </header>

    <main class="groups-main">
      <div class="tabs">
        <span class="tab active">Seus grupos</span>
        <span class="divider">|</span>
        <span class="tab">Grupos públicos</span>
      </div>

      <div class="groups-list">
        <div class="group-item">
          <div class="group-status"></div>
        </div>
        <div class="group-item">
          <div class="group-status"></div>
        </div>
        <div class="group-item">
          <div class="group-status"></div>
        </div>
        <div class="group-item">
          <div class="group-status"></div>
        </div>
        <div class="group-item">
          <div class="group-status"></div>
        </div>
      </div>
    </main>

    <footer class="bottom-bar blue-footer">
      <p>© 2026 Tomin & Metring</p>
    </footer>
  </body>
</html>

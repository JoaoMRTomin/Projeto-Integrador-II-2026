<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathStudy - Grupos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dash-top">
        <h1 class="dash-logo">PathStudy</h1>
        <div class="green-line"></div>
        
        <div class="action-header">
            <div class="action-buttons">
                <button class="btn btn-blue">Criar grupo</button>
                <button class="btn btn-gray">Editar 📝</button>
            </div>
            
            <div class="dropdown">
                <div class="menu-icon">☰</div>
            </div>
        </div>
    </div>

    <main class="groups-main">
        <div class="tabs">
            <span class="tab active">Seus grupos</span>
            <span class="divider">|</span>
            <span class="tab">Grupos públicos</span>
        </div>

        <div class="groups-list">
            <div class="group-item">
                <div class="group-status"></div>
            </div>
            <div class="group-item">
                <div class="group-status"></div>
            </div>
            <div class="group-item">
                <div class="group-status"></div>
            </div>
            <div class="group-item">
                <div class="group-status"></div>
            </div>
            <div class="group-item">
                <div class="group-status"></div>
            </div>
        </div>
    </main>

    <footer class="bottom-bar blue-footer">
        <p>© 2026 Tomin & Metring</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathStudy - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="center-page-container">
        <h1 class="page-title">Coloque suas informações</h1>
        <a href="index.html" class="link-voltar">voltar</a>

        <div class="form-card">
            <!-- Sem tag form para não dar reload, apenas tags visuais -->
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="insira texto...">
            </div>
            <div class="form-group">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" placeholder="insira texto...">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Value">
            </div>
            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" placeholder="insira texto..."></textarea>
            </div>
            
            <!-- Botão falso de envio que redireciona -->
            <a href="obrigado.html" class="btn-dark">Enviar</a>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathStudy - Iniciar Sessão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1 class="logo">PathStudy</h1>
    </header>

    <main class="login-container">
        <div class="login-form">
            <h2>Iniciar sessão agora!</h2>
            
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="insira texto...">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="insira texto...">
            </div>
            
            <a href="#" class="forgot-pwd">esqueceu sua senha?</a>
            <a href="dashboard.html" class="btn btn-block">Entrar</a>
        </div>
        
        <div class="login-image">
            <img src="imagens/reunião estudo.png" alt="Reunião 3D">
            <p>Independente da pessoa que você é, após usar o PathStudy, você sairá como uma pessoa melhor.</p>
        </div>
    </main>

    <footer class="bottom-bar">
        <p>© 2026 Tomin & Metring</p>
    </footer>
</body>
</html>

<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathStudy - Ambiente de Estudos</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      .aula-layout {
        display: flex;
        gap: 25px;
        max-width: 1280px;
        width: 100%;
        margin: 30px auto;
        padding: 0 20px;
        flex: 1;
        box-sizing: border-box;
      }

      .video-area {
        flex: 3;
        display: flex;
        flex-direction: column;
      }

      .video-container {
        position: relative;
        padding-bottom: 56.25%; /* Proporção 16:9 */
        height: 0;
        overflow: hidden;
        width: 100%;
        background-color: #000;
        border-radius: 12px;
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
      }

      #youtube-player {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* Barra Lateral Estilizada (Estilo Udemy/YouTube) */
      .aula-sidebar {
        flex: 1.2;
        background: #ffffff;
        border: 1px solid #e1e4e8;
        border-radius: 12px;
        padding: 15px;
        box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.05);
        max-height: 550px;
        display: flex;
        flex-direction: column;
      }

      .sidebar-title {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        border-bottom: 2px solid #28a745;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }

      .playlist-items {
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-right: 5px;
      }

      .playlist-item {
        display: flex;
        gap: 10px;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
        align-items: center;
      }

      .playlist-item:hover {
        background: #f1f3f5;
      }

      .playlist-item.active {
        background: #e6f4ea;
        border-left: 4px solid #28a745;
      }

      .playlist-item img {
        width: 90px;
        height: 50px;
        object-fit: cover;
        border-radius: 6px;
      }

      .playlist-item-info h4 {
        font-size: 12px;
        color: #333;
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      @media (max-width: 900px) {
        .aula-layout {
          flex-direction: column;
        }
      }

      /* --- WIDGET POMODORO FLUTUANTE --- */
      #pathstudy-pomodoro-widget {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #212529;
        color: #fff;
        padding: 10px 16px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        z-index: 99998;
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: sans-serif;
        border: 1px solid #343a40;
      }
      #pomodoro-mini-timer {
        font-size: 20px;
        font-weight: bold;
        color: #28a745;
        font-family: monospace;
      }
      .pomodoro-btn {
        background: #28a745;
        border: none;
        color: #fff;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: background 0.2s;
      }
      .pomodoro-btn:hover {
        background: #218838;
      }
      .pomodoro-btn-secondary {
        background: #495057;
        border: none;
        color: #fff;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      .pomodoro-btn-secondary:hover {
        background: #343a40;
      }

      /* --- SUPER POP-UP DE CONCLUSÃO --- */
      #pathstudy-super-popup {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.85);
        z-index: 100000;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }
      .super-popup-content {
        background: #1e2124;
        padding: 50px 40px;
        border-radius: 16px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        border: 2px solid #28a745;
      }

      /* --- MODO ZEN GLOBAL & MENU FLUTUANTE --- */
      body.pathstudy-zen-ativo header,
      body.pathstudy-zen-ativo footer {
        display: none !important;
      }
      body.pathstudy-zen-ativo {
        background: #121212 !important;
        color: #fff !important;
      }

      #zen-floating-nav {
        display: none;
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: #1e2124;
        padding: 10px 20px;
        border-radius: 30px;
        z-index: 99999;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        border: 1px solid #333;
        align-items: center;
        gap: 15px;
      }
      #zen-floating-nav a {
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        transition: color 0.2s;
      }
      #zen-floating-nav a:hover {
        color: #28a745;
      }
      .btn-sair-zen-mini {
        background: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-sair-zen-mini:hover {
        background: #c82333;
      }
    </style>
  </head>
  <body>
    <header class="dash-top">
      <h1 class="dash-logo">PathStudy</h1>
      <div class="green-line"></div>
      <div class="dash-header">
        <a
          href="dashboard.html"
          class="btn"
          style="padding: 8px 16px; font-size: 13px"
          >← Voltar ao Painel</a
        >
      </div>
    </header>

    <!-- Menu Flutuante ativo apenas no Modo Zen -->
    <div id="zen-floating-nav">
      <a href="index.html">Início</a>
      <a href="dashboard.html">Painel</a>
      <a href="ferramentas.html">Ferramentas</a>
      <button class="btn-sair-zen-mini" id="btn-sair-zen-global">
        Desativar
      </button>
    </div>

    <main class="aula-layout">
      <!-- Coluna do Player -->
      <div class="video-area">
        <div class="video-container">
          <div id="youtube-player"></div>
        </div>
      </div>

      <!-- Barra Lateral com a Lista de Aulas -->
      <aside class="aula-sidebar">
        <h3 class="sidebar-title">Módulos da Playlist</h3>
        <div id="lista-videos" class="playlist-items">
          <p
            style="
              font-size: 13px;
              color: #666;
              text-align: center;
              margin-top: 20px;
            "
          >
            A carregar aulas...
          </p>
        </div>
      </aside>
    </main>

    <!-- Widget Pomodoro Flutuante -->
    <div id="pathstudy-pomodoro-widget">
      <span id="pomodoro-mini-timer">25:00</span>
      <button class="pomodoro-btn" id="pomodoro-mini-toggle">Iniciar</button>
      <button
        class="pomodoro-btn-secondary"
        id="pomodoro-mini-reset"
        title="Reiniciar"
      >
        🔄
      </button>
    </div>

    <!-- Super Pop-up de Conclusão -->
    <div id="pathstudy-super-popup">
      <div class="super-popup-content">
        <h2 style="color: #28a745; font-size: 26px; margin-bottom: 20px">
          ⏱️ Pomodoro Concluído!
        </h2>
        <p
          style="
            color: #fff;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 30px;
          "
        >
          Seção concluída. Descanse rapidamente e volte daqui a pouco.
        </p>
        <button
          class="pomodoro-btn"
          id="fechar-super-popup"
          style="padding: 12px 30px; font-size: 15px"
        >
          Entendido
        </button>
      </div>
    </div>

    <footer class="bottom-bar">
      <p>© 2026 Tomin & Metring</p>
    </footer>

    <script>
      let player;
      let videoIds = [];
      const urlParams = new URLSearchParams(window.location.search);
      const playlistId = urlParams.get("list");
      const storageKey = `pathstudy_progresso_${playlistId || "geral"}`;

      const API_KEY = "AIzaSyCL47j93NKnuecuZlIeFurcxtg2hQTHsb4";

      // Carrega a API do YouTube
      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document
        .getElementsByTagName("script")[0]
        .parentNode.insertBefore(
          tag,
          document.getElementsByTagName("script")[0],
        );

      window.onYouTubeIframeAPIReady = function () {
        let savedIndex = parseInt(localStorage.getItem(storageKey)) || 0;

        player = new YT.Player("youtube-player", {
          height: "100%",
          width: "100%",
          playerVars: {
            listType: "playlist",
            list: playlistId,
            index: savedIndex,
            autoplay: 0,
            rel: 0,
          },
          events: {
            onReady: () => carregarDetalhesPlaylist(savedIndex),
            onStateChange: onPlayerStateChange,
          },
        });
      };

      async function carregarDetalhesPlaylist(currentIndex) {
        if (!playlistId || API_KEY === "TUA_API_KEY_AQUI") {
          document.getElementById("lista-videos").innerHTML =
            '<p style="font-size:12px; color:red; padding:10px;">Configura a tua API_KEY do YouTube para ver a lista de aulas.</p>';
          return;
        }

        try {
          const response = await fetch(
            `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${API_KEY}`,
          );
          const data = await response.json();

          const container = document.getElementById("lista-videos");
          container.innerHTML = "";

          data.items.forEach((item, index) => {
            const snippet = item.snippet;
            const videoId = snippet.resourceId.videoId;
            videoIds.push(videoId);

            const thumbnail = snippet.thumbnails.medium
              ? snippet.thumbnails.medium.url
              : "";
            const title = snippet.title;

            const card = document.createElement("div");
            card.className = `playlist-item ${index === currentIndex ? "active" : ""}`;
            card.id = `video-card-${index}`;

            card.innerHTML = `
                        <img src="${thumbnail}" alt="Miniatura">
                        <div class="playlist-item-info">
                            <h4>${index + 1}. ${title}</h4>
                        </div>
                    `;

            card.addEventListener("click", () => {
              player.playVideoAt(index);
              atualizarCardAtivo(index);
            });

            container.appendChild(card);
          });
        } catch (err) {
          console.error("Erro ao buscar vídeos da playlist:", err);
        }
      }

      function onPlayerStateChange(event) {
        if (player && typeof player.getPlaylistIndex === "function") {
          const currentIndex = player.getPlaylistIndex();
          if (currentIndex >= 0) {
            localStorage.setItem(storageKey, currentIndex);
            atualizarCardAtivo(currentIndex);
          }
        }
      }

      function atualizarCardAtivo(index) {
        document.querySelectorAll(".playlist-item").forEach((el, idx) => {
          if (idx === index) {
            el.classList.add("active");
            el.scrollIntoView({ behavior: "smooth", block: "nearest" });
          } else {
            el.classList.remove("active");
          }
        });
      }

      // --- SISTEMA GLOBAL DE FOCO (POMODORO & ZEN) ---
      document.addEventListener("DOMContentLoaded", () => {
        const timerDisplay = document.getElementById("pomodoro-mini-timer");
        const toggleBtn = document.getElementById("pomodoro-mini-toggle");
        const resetBtn = document.getElementById("pomodoro-mini-reset");
        const superPopup = document.getElementById("pathstudy-super-popup");
        const fecharPopupBtn = document.getElementById("fechar-super-popup");
        const TEMPO_PADRAO = 25 * 60;

        function obterEstadoPomodoro() {
          return (
            JSON.parse(localStorage.getItem("pathstudy_pomodoro")) || {
              fim: null,
              duracao: TEMPO_PADRAO,
              ativo: false,
            }
          );
        }
        function salvarEstadoPomodoro(estado) {
          localStorage.setItem("pathstudy_pomodoro", JSON.stringify(estado));
        }

        function atualizarRelogioGlobal() {
          let estado = obterEstadoPomodoro();
          if (!estado.ativo || !estado.fim) {
            const m = Math.floor(estado.duracao / 60),
              s = estado.duracao % 60;
            if (timerDisplay)
              timerDisplay.textContent = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
            if (toggleBtn) toggleBtn.textContent = "Iniciar";
            return;
          }
          const segundosRestantes = Math.max(
            0,
            Math.round((estado.fim - Date.now()) / 1000),
          );
          const m = Math.floor(segundosRestantes / 60),
            s = segundosRestantes % 60;
          if (timerDisplay)
            timerDisplay.textContent = `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
          if (toggleBtn) toggleBtn.textContent = "Pausar";

          if (segundosRestantes <= 0) {
            salvarEstadoPomodoro({
              fim: null,
              duracao: TEMPO_PADRAO,
              ativo: false,
            });
            if (superPopup) superPopup.style.display = "flex";
            atualizarRelogioGlobal();
          }
        }

        setInterval(atualizarRelogioGlobal, 1000);
        atualizarRelogioGlobal();

        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            let estado = obterEstadoPomodoro();
            if (estado.ativo) {
              salvarEstadoPomodoro({
                fim: null,
                duracao: TEMPO_PADRAO,
                ativo: false,
              });
            } else {
              salvarEstadoPomodoro({
                fim: Date.now() + estado.duracao * 1000,
                duracao: estado.duracao,
                ativo: true,
              });
            }
            atualizarRelogioGlobal();
          });
        }

        if (resetBtn) {
          resetBtn.addEventListener("click", () => {
            salvarEstadoPomodoro({
              fim: null,
              duracao: TEMPO_PADRAO,
              ativo: false,
            });
            atualizarRelogioGlobal();
          });
        }

        if (fecharPopupBtn && superPopup) {
          fecharPopupBtn.addEventListener("click", () => {
            superPopup.style.display = "none";
          });
        }

        // Modo Zen & Menu Flutuante
        const zenNav = document.getElementById("zen-floating-nav");
        const btnSairZen = document.getElementById("btn-sair-zen-global");

        function aplicarModoZen(ativo) {
          if (ativo) {
            document.body.classList.add("pathstudy-zen-ativo");
            if (zenNav) zenNav.style.display = "flex";
          } else {
            document.body.classList.remove("pathstudy-zen-ativo");
            if (zenNav) zenNav.style.display = "none";
          }
        }

        if (localStorage.getItem("pathstudy_zen") === "true") {
          aplicarModoZen(true);
        }

        document.addEventListener(
          "click",
          () => {
            if (
              localStorage.getItem("pathstudy_zen") === "true" &&
              !document.fullscreenElement
            ) {
              document.documentElement.requestFullscreen().catch(() => {});
            }
          },
          { once: true },
        );

        if (btnSairZen) {
          btnSairZen.addEventListener("click", () => {
            localStorage.setItem("pathstudy_zen", "false");
            aplicarModoZen(false);
            if (document.fullscreenElement)
              document.exitFullscreen().catch(() => {});
          });
        }
      });

      // --- FUNCIONALIDADE DE ARRASTAR O WIDGET DO POMODORO ---
      const pomodoroWidget = document.getElementById(
        "pathstudy-pomodoro-widget",
      );

      if (pomodoroWidget) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        pomodoroWidget.addEventListener("mousedown", (e) => {
          // Evita arrastar se o utilizador clicar nos botões de iniciar/reiniciar
          if (e.target.tagName === "BUTTON") return;

          isDragging = true;
          pomodoroWidget.style.cursor = "grabbing";

          // Posição inicial do rato e do elemento
          startX = e.clientX;
          startY = e.clientY;

          const rect = pomodoroWidget.getBoundingClientRect();
          initialLeft = rect.left;
          initialTop = rect.top;

          // Troca posições relativas (bottom/right) por absolutas (left/top) para permitir movimento livre
          pomodoroWidget.style.bottom = "auto";
          pomodoroWidget.style.right = "auto";
          pomodoroWidget.style.left = `${initialLeft}px`;
          pomodoroWidget.style.top = `${initialTop}px`;

          e.preventDefault();
        });

        document.addEventListener("mousemove", (e) => {
          if (!isDragging) return;

          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          pomodoroWidget.style.left = `${initialLeft + dx}px`;
          pomodoroWidget.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener("mouseup", () => {
          if (isDragging) {
            isDragging = false;
            pomodoroWidget.style.cursor = "default";
          }
        });

        // Suporte opcional para dispositivos tácteis (Telemóveis / Tablets)
        pomodoroWidget.addEventListener("touchstart", (e) => {
          if (e.target.tagName === "BUTTON") return;
          const touch = e.touches[0];
          isDragging = true;

          startX = touch.clientX;
          startY = touch.clientY;

          const rect = pomodoroWidget.getBoundingClientRect();
          initialLeft = rect.left;
          initialTop = rect.top;

          pomodoroWidget.style.bottom = "auto";
          pomodoroWidget.style.right = "auto";
          pomodoroWidget.style.left = `${initialLeft}px`;
          pomodoroWidget.style.top = `${initialTop}px`;
        });

        document.addEventListener("touchmove", (e) => {
          if (!isDragging) return;
          const touch = e.touches[0];
          const dx = touch.clientX - startX;
          const dy = touch.clientY - startY;

          pomodoroWidget.style.left = `${initialLeft + dx}px`;
          pomodoroWidget.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener("touchend", () => {
          isDragging = false;
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathStudy - Painel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- AQUI ESTÁ A CORREÇÃO: Usando a tag semântica <header> -->
    <header class="dash-top">
      <h1 class="dash-logo">PathStudy</h1>
      <div class="green-line"></div>
      <div class="dash-header">
        <!-- Adicionamos o id aqui para o JS encontrar -->
        <span class="welcome" id="nome-usuario">Bem-vindo!</span>

        <div class="search-bar">
          <input type="text" placeholder="Pesquisar" />
        </div>
        <div class="dropdown">
          <div class="menu-icon">☰</div>
          <div class="conteudo-dropdown">
            <a href="index.html">Início</a>
            <a href="dashboard.html">Painel</a>
            <a href="grupos.html">Grupos</a>
            <a href="contato.html">Contato</a>
            <a href="#" id="link-sair">Sair</a>
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard-main">
      <div class="blue-wave"></div>

      <section>
        <h3 class="title-center">Mais procurados:</h3>
        <div class="carousel">
          <span class="arrow">←</span>
          <div class="card blue-card"></div>
          <div class="card blue-card"></div>
          <div class="card blue-card"></div>
          <div class="card blue-card"></div>
          <span class="arrow">→</span>
        </div>
      </section>

      <div class="blue-wave"></div>

      <section>
        <h3 class="title-left">Cursos Recentes ➔</h3>
        <div class="carousel carousel-left">
          <div class="card dark-card"></div>
          <div class="card dark-card"></div>
          <div class="card dark-card"></div>
          <div class="card dark-card"></div>
        </div>
      </section>
    </main>

    <footer class="bottom-bar">
      <p>© 2026 Tomin & Metring</p>
    </footer>
    <!-- JS pro "bem vindo"-->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Pega os dados salvos no navegador no momento do login/cadastro
        const dadosUsuario = localStorage.getItem("usuarioLogado");

        if (dadosUsuario) {
          // Transforma o texto JSON salvo de volta em um objeto do JavaScript
          const usuario = JSON.parse(dadosUsuario);

          // Encontra o span do welcome e altera o texto para incluir o nome
          const spanWelcome = document.querySelector("#nome-usuario");
          spanWelcome.textContent = `Bem-vindo, ${usuario.nome}!`;
        } else {
          // Se alguém tentar entrar no painel digitando a URL sem logar, manda de volta pro login
          window.location.href = "login.html";
        }
      });

      /* LOGOUT*/

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Lógica para carregar o nome do usuário (que já fizemos)
            const dadosUsuario = localStorage.getItem('usuarioLogado');

            if (dadosUsuario) {
                const usuario = JSON.parse(dadosUsuario);
                const primeiroNome = usuario.nome.split(' ')[0];
                const spanWelcome = document.querySelector('#nome-usuario');
                if (spanWelcome) {
                    spanWelcome.textContent = `Bem-vindo, ${primeiroNome}!`;
                }
            } else {
                // Se não estiver logado, expulsa para o login
                window.location.href = 'login.html';
            }

            // 2. Lógica nova para o botão de SAIR do menu
            const linkSair = document.querySelector('#link-sair');
            if (linkSair) {
                linkSair.addEventListener('click', (e) => {
                    e.preventDefault(); // Impede o link de seguir o '#' vazio
                    
                    // Apaga os dados do usuário do navegador
                    localStorage.removeItem('usuarioLogado');
                    
                    // Redireciona para a página inicial (index.html)
                    window.location.href = 'index.html';
                });
            }
        });
    </script>
  </body>
</html>
